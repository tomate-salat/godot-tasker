<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mockup des Tasker-Tischs in Godot: Spielen</title>
<desc>Oben eine Kopfzeile mit Milestone, Fortschritt, Wochenziel und Serie. In der Mitte der Tisch mit sieben Plätzen für gespielte Karten, links gesperrte Karten und der Nachziehstapel, rechts der Erledigt-Stapel. Unten die aufgefächerte Hand mit den offenen Karten. Die Titel sind erfundene Beispiele.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray text{fill:#444441}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11}.c-green text{fill:#27500A}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}.c-purple text{fill:#3C3489}
</style>
<rect width="680" height="480" fill="#FFFFFF"/>

<text class="th" x="20" y="26">Vertical slice</text>
<rect x="150" y="17" width="190" height="8" rx="4" fill="#B4B2A9"/>
<rect x="150" y="17" width="106" height="8" rx="4" fill="#1D9E75"/>
<text class="ts" x="350" y="26">23/41</text>
<text class="ts" x="410" y="26">noch 6 Tage</text>
<text class="ts" x="500" y="26">Woche 4/6</text>
<text class="ts" x="578" y="26">Serie 3 Wochen</text>

<rect x="8" y="44" width="664" height="262" rx="12" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="0.5"/>

<text class="ts" x="24" y="68">Gesperrt 2</text>
<g class="c-gray">
<rect x="34" y="80" width="54" height="76" rx="6" stroke-width="0.5" transform="rotate(4 61 118)"/>
<rect x="26" y="78" width="54" height="76" rx="6" stroke-width="0.5"/>
<text class="ts" x="53" y="108" text-anchor="middle">Boss</text>
<text class="ts" x="53" y="124" text-anchor="middle">Kampf</text>
</g>
<line x1="20" y1="134" x2="96" y2="134" stroke="#888780" stroke-width="3" stroke-dasharray="5 3"/>
<text class="ts" x="53" y="150" text-anchor="middle">Kette</text>

<text class="ts" x="24" y="196">Nachziehstapel</text>
<g class="c-gray">
<rect x="32" y="212" width="54" height="76" rx="6" stroke-width="0.5"/>
<rect x="29" y="209" width="54" height="76" rx="6" stroke-width="0.5"/>
<rect x="26" y="206" width="54" height="76" rx="6" stroke-width="0.5"/>
<text class="th" x="53" y="250" text-anchor="middle">12</text>
</g>

<text class="ts" x="136" y="68">Im Spiel 3</text>
<g class="c-blue">
<rect x="136" y="100" width="54" height="76" rx="6" stroke-width="0.5"/>
<text class="ts" x="163" y="126" text-anchor="middle">Sprung</text>
<text class="ts" x="163" y="142" text-anchor="middle">Physik</text>
<rect x="196" y="100" width="54" height="76" rx="6" stroke-width="0.5"/>
<text class="ts" x="223" y="126" text-anchor="middle">HUD</text>
<text class="ts" x="223" y="142" text-anchor="middle">Leben</text>
<rect x="256" y="100" width="54" height="76" rx="6" stroke-width="0.5"/>
<text class="ts" x="283" y="126" text-anchor="middle">Gegner</text>
<text class="ts" x="283" y="142" text-anchor="middle">Pfade</text>
</g>
<g fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4">
<rect x="316" y="100" width="54" height="76" rx="6"/>
<rect x="376" y="100" width="54" height="76" rx="6"/>
<rect x="436" y="100" width="54" height="76" rx="6"/>
<rect x="496" y="100" width="54" height="76" rx="6"/>
</g>
<text class="ts" x="343" y="143" text-anchor="middle">4</text>
<text class="ts" x="403" y="143" text-anchor="middle">5</text>
<text class="ts" x="463" y="143" text-anchor="middle">6</text>
<text class="ts" x="523" y="143" text-anchor="middle">7</text>

<text class="ts" x="136" y="212">Aufgefächerter Stapel: Gegner</text>
<g class="c-gray">
<rect x="136" y="222" width="46" height="64" rx="5" stroke-width="0.5"/>
<text class="ts" x="159" y="258" text-anchor="middle">Pfade</text>
<rect x="188" y="222" width="46" height="64" rx="5" stroke-width="0.5"/>
<text class="ts" x="211" y="258" text-anchor="middle">Sicht</text>
<rect x="240" y="222" width="46" height="64" rx="5" stroke-width="0.5"/>
<text class="ts" x="263" y="258" text-anchor="middle">Angriff</text>
</g>

<text class="ts" x="580" y="68">Erledigt</text>
<g class="c-green">
<rect x="584" y="84" width="54" height="76" rx="6" stroke-width="0.5" transform="rotate(-7 611 122)"/>
<rect x="584" y="84" width="54" height="76" rx="6" stroke-width="0.5" transform="rotate(5 611 122)"/>
<rect x="584" y="84" width="54" height="76" rx="6" stroke-width="0.5" transform="rotate(-2 611 122)"/>
<text class="ts" x="611" y="118" text-anchor="middle">Menü</text>
<text class="th" x="611" y="140" text-anchor="middle">+1</text>
</g>
<text class="ts" x="611" y="186" text-anchor="middle">23 erledigt</text>
<text class="ts" x="611" y="204" text-anchor="middle">4 diese Woche</text>

<text class="ts" x="20" y="332">Hand: offene Karten 7</text>
<g class="c-gray">
<g transform="translate(166 420) rotate(-18)"><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Sound</text></g>
<g transform="translate(224 400) rotate(-12)"><rect x="-29" y="-42" width="70" height="96" rx="7" stroke-width="0.5"/><rect x="-32" y="-45" width="70" height="96" rx="7" stroke-width="0.5"/><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Level 2</text><text class="ts" x="0" y="34" text-anchor="middle">2/5</text></g>
<g transform="translate(282 388) rotate(-6)"><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Savegame</text></g>
<g transform="translate(398 388) rotate(6)"><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Kamera</text></g>
<g transform="translate(456 400) rotate(12)"><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Partikel</text></g>
<g transform="translate(514 420) rotate(18)"><rect x="-35" y="-48" width="70" height="96" rx="7" stroke-width="0.5"/><text class="ts" x="0" y="-22" text-anchor="middle">Credits</text></g>
</g>
<g class="c-purple" transform="translate(340 356)">
<rect x="-38" y="-52" width="76" height="104" rx="7" stroke-width="1.5"/>
<text class="th" x="0" y="-24" text-anchor="middle">Dialoge</text>
<text class="ts" x="0" y="-6" text-anchor="middle">Prio hoch</text>
<text class="ts" x="0" y="38" text-anchor="middle">unter Zeiger</text>
</g>
<text class="ts" x="560" y="372">Ziehen auf den</text>
<text class="ts" x="560" y="390">Tisch spielt aus</text>
</svg>
